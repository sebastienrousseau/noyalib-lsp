[book]
title = "The noyalib-lsp Manual"
description = "A YAML language server: formatting, diagnostics, and hover, built on noyalib."
authors = ["Sebastien Rousseau"]
language = "en"
src = "."

[build]
build-dir = "../target-book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/sebastienrousseau/noyalib-lsp"
edit-url-template = "https://github.com/sebastienrousseau/noyalib-lsp/edit/main/docs/{path}"
site-url = "/noyalib-lsp/manual/"
