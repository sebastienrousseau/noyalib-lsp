[package]
name = "noyalib-lsp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.noyalib-lsp]
path = ".."

[[bin]]
name = "fuzz_handle_message"
path = "fuzz_targets/fuzz_handle_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_did_change"
path = "fuzz_targets/fuzz_did_change.rs"
test = false
doc = false
bench = false

# Pre-release: the parent manifest's git patch, until the cut removes
# both (scripts/verify-release-versions.sh checks this file too).
[patch.crates-io]
noyalib = { git = "https://github.com/sebastienrousseau/noyalib", branch = "feat/v0.0.35" }
